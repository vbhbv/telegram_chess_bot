<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Chess Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #151515; color: white; margin: 0; padding: 10px; }
        #board { width: 90vw; max-width: 400px; margin: 20px auto; }
    </style>
</head>
<body>
    <h2>لعبة الشطرنج المباشرة ♟️</h2>
    <div id="board"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const board = Chessboard('board', {
            draggable: true,
            position: 'start',
            onDrop: handleMove
        });

        // تحديد البروتوكول (ws أو wss) ديناميكياً
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

        ws.onmessage = (event) => {
            const moveData = JSON.parse(event.data);
            board.position(moveData.position);
        };

        function handleMove(source, target) {
            // إرسال الحركة فور وقوعها عبر WebSocket
            setTimeout(() => {
                ws.send(JSON.stringify({
                    source: source,
                    target: target,
                    position: board.position()
                }));
            }, 250);
        }
    </script>
</body>
</html>
